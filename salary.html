<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能薪资计算器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body {
    background: linear-gradient(135deg, #4b3b8b, #6c5ce7);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; color: #333;
}
.header { text-align: center; color: white; margin-bottom: 20px; }
.header h1 { font-size: 24px; margin-bottom: 8px; }
.header p { font-size: 14px; opacity: 0.8; }

.container {
    display: flex; gap: 20px; width: 100%; max-width: 1050px; align-items: flex-start;
}
.left-panel {
    flex: 1; background: #f8f9fa; border-radius: 12px; padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 14px;
}
.right-panel {
    flex: 1.2; background: #f8f9fa; border-radius: 12px; padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 620px;
}
.section-title {
    font-size: 15px; font-weight: bold; color: #444;
    display: flex; align-items: center; gap: 8px;
}
.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-group label { font-size: 12px; color: #666; }
.input-group input {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13px; outline: none; transition: border 0.2s;
}
.input-group input:focus { border-color: #6c5ce7; }
.time-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.info-box {
    background: #eef0f5; border-radius: 8px; padding: 10px 12px;
    font-size: 12px; color: #666; line-height: 1.9;
}
.info-box b { color: #6c5ce7; }

.status-badge {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold;
    transition: all 0.3s;
}
.status-badge.working { background: #e8f5e9; color: #2e7d32; }
.status-badge.lunch { background: #fff3e0; color: #e65100; }
.status-badge.ended { background: #eceff1; color: #607d8b; }
.status-badge.before { background: #e3f2fd; color: #1565c0; }
.status-badge .dot {
    width: 8px; height: 8px; border-radius: 50%; background: currentColor;
    animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.realtime-card {
    background: linear-gradient(135deg, #2c3e50, #1a252f);
    color: white; border-radius: 12px; padding: 18px;
}
.earned-amount {
    font-size: 34px; font-weight: bold; margin: 6px 0 16px 0;
    font-family: 'Courier New', monospace; text-align: center;
}
.stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px;
}
.stat-item {
    background: rgba(255,255,255,0.08); border-radius: 8px; padding: 8px; text-align: center;
}
.stat-item .label { font-size: 11px; color: #b0bec5; margin-bottom: 4px; }
.stat-item .value { font-size: 13px; font-weight: bold; font-family: monospace; }
.slack-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.time-info {
    display: flex; justify-content: space-between; font-size: 12px; color: #b0bec5;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);
}
.action-buttons { display: flex; gap: 10px; }
.btn {
    flex: 1; padding: 11px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: bold; cursor: pointer;
    transition: opacity 0.2s, background 0.3s; color: white;
}
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-slack { background: #ff9800; }
.btn-slack.active { background: #4caf50; }
.btn-end { background: #e53935; }

.history-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.history-table th {
    text-align: left; padding: 9px 6px; color: #888;
    border-bottom: 1px solid #eee; font-weight: normal; font-size: 12px;
}
.history-table td {
    padding: 10px 6px; border-bottom: 1px solid #f0f0f0; color: #444;
}
.history-table tr:hover { background: #f5f6fa; }
.auto-tag {
    display: inline-block; font-size: 10px; background: #e8eaf6;
    color: #5c6bc0; padding: 1px 5px; border-radius: 3px; margin-left: 4px;
}
.empty-state { text-align: center; padding: 60px 0; color: #aaa; }
.empty-state .icon { font-size: 40px; margin-bottom: 10px; }
.record-actions span {
    cursor: pointer; margin-right: 8px; font-size: 12px;
}
.record-actions .edit { color: #1976d2; }
.record-actions .del { color: #e53935; }

@media (max-width: 820px) {
    .container { flex-direction: column; }
    .left-panel, .right-panel { width: 100%; }
    .right-panel { min-height: auto; }
}
</style>
</head>
<body>

<div class="header">
    <h1>💼 智能薪资计算器</h1>
    <p>自动计时 · 午休暂停 · 摸鱼统计 · 加班追踪</p>
</div>

<div class="container">
    <!-- 左侧 -->
    <div class="left-panel">
        <div class="section-title">⚙️ 设置</div>

        <div class="input-group">
            <label>日薪金额（元）</label>
            <input type="number" id="dailySalary" min="0" step="0.01">
        </div>

        <div class="time-grid">
            <div class="input-group">
                <label>上班时间</label>
                <input type="time" id="workStart">
            </div>
            <div class="input-group">
                <label>下班时间</label>
                <input type="time" id="workEnd">
            </div>
            <div class="input-group">
                <label>午休开始</label>
                <input type="time" id="lunchStart">
            </div>
            <div class="input-group">
                <label>午休结束</label>
                <input type="time" id="lunchEnd">
            </div>
        </div>

        <div class="info-box" id="infoBox"></div>

        <div class="section-title">📊 今日实时数据</div>

        <div class="status-badge before" id="statusBadge">
            <div class="dot"></div>
            <span id="statusText">加载中…</span>
        </div>

        <div class="realtime-card">
            <div style="font-size:12px;color:#b0bec5;text-align:center;">今日截止目前已赚</div>
            <div class="earned-amount" id="earnedAmount">¥0.00</div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="label">工作时长</div>
                    <div class="value" id="workedTime">00:00:00</div>
                </div>
                <div class="stat-item">
                    <div class="label">时薪</div>
                    <div class="value" id="hourlyRate">0.00</div>
                </div>
                <div class="stat-item">
                    <div class="label">完成度</div>
                    <div class="value" id="progress">0.0%</div>
                </div>
            </div>

            <div class="slack-row">
                <div class="stat-item">
                    <div class="label">摸鱼时长</div>
                    <div class="value" id="slackTime">00:00:00</div>
                </div>
                <div class="stat-item">
                    <div class="label">摸鱼所得</div>
                    <div class="value" id="slackEarned" style="color:#ffeb3b;">¥0.00</div>
                </div>
            </div>

            <div class="time-info">
                <span>当前时间：<span id="currentTime">--:--:--</span></span>
                <span>距离下班：<span id="timeToOff">--:--:--</span></span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-slack" id="slackBtn" onclick="toggleSlack()">🐟 开始摸鱼</button>
            <!-- 按钮文字改为“下班” -->
            <button class="btn btn-end" id="endBtn" onclick="endDay()">🚪 下班</button>
        </div>
    </div>

    <!-- 右侧 -->
    <div class="right-panel">
        <div class="section-title">📅 历史工作日清单</div>
        <table class="history-table">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>工作时长</th>
                    <th>摸鱼时长</th>
                    <th>加班时长</th>
                    <th>薪资</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script>
/* ================== 默认设置 ================== */
const DEFAULT_SETTINGS = {
    dailySalary: 1117,
    workStart: '08:55',
    workEnd: '18:00',
    lunchStart: '12:00',
    lunchEnd: '13:30'
};
const STORAGE_KEY = 'salaryCalcV3';

/* ================== 状态 ================== */
let state = {
    settings: { ...DEFAULT_SETTINGS },
    history: [],
    slackSeconds: 0,
    slackStartTime: null,
    isSlacking: false,
    isEndedToday: false,      // 是否已下班
    finalWorkedSeconds: null,
    currentWorkedSeconds: 0,
    todayDate: null,
    lastActiveDate: null
};

/* ================== 工具函数 ================== */
function getDateStr(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
}
function timeToSeconds(t) {
    if (!t) return 0;
    const [h, m] = t.split(':').map(Number);
    return h * 3600 + m * 60;
}
function pad(n) { return String(n).padStart(2, '0'); }
function formatTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function getStandardWorkSeconds() {
    const s = state.settings;
    const start = timeToSeconds(s.workStart);
    const end = timeToSeconds(s.workEnd);
    const ls = timeToSeconds(s.lunchStart);
    const le = timeToSeconds(s.lunchEnd);
    return Math.max(1, (ls - start) + (end - le));
}

function calcWorkedSeconds(now) {
    const s = state.settings;
    const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const startSec = timeToSeconds(s.workStart);
    const endSec = timeToSeconds(s.workEnd);
    const lsSec = timeToSeconds(s.lunchStart);
    const leSec = timeToSeconds(s.lunchEnd);

    if (nowSec <= startSec) return 0;

    const effectiveNow = Math.min(nowSec, endSec);
    let worked = 0;

    const morningEnd = Math.min(effectiveNow, lsSec);
    if (morningEnd > startSec) worked += morningEnd - startSec;

    if (effectiveNow > leSec) worked += effectiveNow - leSec;

    return worked;
}

function getSlackSeconds(now) {
    let total = state.slackSeconds;
    if (state.isSlacking && state.slackStartTime) {
        total += (now.getTime() - state.slackStartTime) / 1000;
    }
    return Math.floor(total);
}

/* ================== 本地存储 ================== */
function save() {
    const toSave = {
        settings: state.settings,
        history: state.history,
        todayDate: state.todayDate,
        lastActiveDate: state.lastActiveDate,
        isEndedToday: state.isEndedToday,
        finalWorkedSeconds: state.finalWorkedSeconds,
        slackSeconds: state.slackSeconds
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
}
function load() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.settings) state.settings = { ...DEFAULT_SETTINGS, ...data.settings };
        if (Array.isArray(data.history)) state.history = data.history;
        state.todayDate = data.todayDate || null;
        state.lastActiveDate = data.lastActiveDate || null;
        state.isEndedToday = !!data.isEndedToday;
        state.finalWorkedSeconds = data.finalWorkedSeconds ?? null;
        state.slackSeconds = data.slackSeconds || 0;
    } catch (e) { console.warn('读取本地数据失败', e); }
}

/* ================== 补录逻辑 ================== */
function checkMissedDays() {
    const today = getDateStr(new Date());
    const last = state.lastActiveDate;

    if (!last || last === today) {
        state.lastActiveDate = today;
        return;
    }

    const lastD = new Date(last + 'T00:00:00');
    const todayD = new Date(today + 'T00:00:00');
    const diffDays = Math.round((todayD - lastD) / 86400000);

    if (diffDays === 1) {
        if (!state.history.some(r => r.date === last)) {
            const day = lastD.getDay();
            if (day >= 1 && day <= 5) {
                pushAutoRecord(last);
            }
        }
    }
    state.lastActiveDate = today;
}

function pushAutoRecord(dateStr) {
    const standardSec = getStandardWorkSeconds();
    const perSec = state.settings.dailySalary / standardSec;
    state.history.push({
        date: dateStr,
        workedTime: formatTime(standardSec),
        slackTime: '00:00:00',
        overtime: '00:00:00',
        salary: (standardSec * perSec).toFixed(2),
        auto: true
    });
    sortHistory();
}

function sortHistory() {
    state.history.sort((a, b) => b.date.localeCompare(a.date));
}

/* ================== 渲染 ================== */
const els = {
    dailySalary: document.getElementById('dailySalary'),
    workStart: document.getElementById('workStart'),
    workEnd: document.getElementById('workEnd'),
    lunchStart: document.getElementById('lunchStart'),
    lunchEnd: document.getElementById('lunchEnd'),
    infoBox: document.getElementById('infoBox'),
    statusBadge: document.getElementById('statusBadge'),
    statusText: document.getElementById('statusText'),
    earnedAmount: document.getElementById('earnedAmount'),
    workedTime: document.getElementById('workedTime'),
    hourlyRate: document.getElementById('hourlyRate'),
    progress: document.getElementById('progress'),
    slackTime: document.getElementById('slackTime'),
    slackEarned: document.getElementById('slackEarned'),
    currentTime: document.getElementById('currentTime'),
    timeToOff: document.getElementById('timeToOff'),
    slackBtn: document.getElementById('slackBtn'),
    endBtn: document.getElementById('endBtn'),
    historyBody: document.getElementById('historyBody')
};

function renderInfoBox() {
    const s = state.settings;
    const std = getStandardWorkSeconds();
    const h = (std / 3600).toFixed(2);
    const m = Math.round(std / 60);
    els.infoBox.innerHTML = `
        <span>🕐 工作时间：${s.workStart} - ${s.lunchStart}，${s.lunchEnd} - ${s.workEnd}</span><br>
        <span>☕ 午休时间：${s.lunchStart} - ${s.lunchEnd}（暂停统计）</span><br>
        <span>⏱️ 标准工作时长：<b>${h} 小时</b>（${m} 分钟）</span><br>
        <span>💡 摸鱼期间正常计算薪资</span><br>
        <span>🚀 忘记点下班默认无加班，按标准时间补录</span>
    `;
}

function renderHistory() {
    if (!state.history.length) {
        els.historyBody.innerHTML = `
            <tr><td colspan="6" class="empty-state">
                <div class="icon">💻</div>
                <div>暂无历史记录</div>
                <div style="font-size:12px;margin-top:6px;">今天开始工作吧！</div>
            </td></tr>`;
        return;
    }
    let html = '';
    state.history.forEach((r, i) => {
        html += `
            <tr>
                <td>${r.date}${r.auto ? '<span class="auto-tag">自动</span>' : ''}</td>
                <td>${r.workedTime}</td>
                <td>${r.slackTime}</td>
                <td>${r.overtime}</td>
                <td style="font-weight:bold;color:#6c5ce7;">¥${r.salary}</td>
                <td class="record-actions">
                    <span class="edit" onclick="editRecord(${i})">编辑</span>
                    <span class="del" onclick="deleteRecord(${i})">删除</span>
                </td>
            </tr>`;
    });
    els.historyBody.innerHTML = html;
}

function renderUI(now) {
    const s = state.settings;
    const perSec = s.dailySalary / getStandardWorkSeconds();

    const workedSec = state.isEndedToday && state.finalWorkedSeconds != null
        ? state.finalWorkedSeconds
        : calcWorkedSeconds(now);
    state.currentWorkedSeconds = workedSec;

    const slackSec = getSlackSeconds(now);
    const earned = workedSec * perSec;
    const slackEarned = slackSec * perSec;
    const hourly = perSec * 3600;
    const progress = Math.min(100, (workedSec / getStandardWorkSeconds()) * 100);

    els.earnedAmount.textContent = `¥${earned.toFixed(2)}`;
    els.workedTime.textContent = formatTime(workedSec);
    els.hourlyRate.textContent = hourly.toFixed(2);
    els.progress.textContent = `${progress.toFixed(1)}%`;
    els.slackTime.textContent = formatTime(slackSec);
    els.slackEarned.textContent = `¥${slackEarned.toFixed(2)}`;

    const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    els.currentTime.textContent = formatTime(nowSec);
    const endSec = timeToSeconds(s.workEnd);
    els.timeToOff.textContent = nowSec < endSec ? formatTime(endSec - nowSec) : '已下班';

    const startSec = timeToSeconds(s.workStart);
    const lsSec = timeToSeconds(s.lunchStart);
    const leSec = timeToSeconds(s.lunchEnd);

    if (state.isEndedToday) {
        els.statusBadge.className = 'status-badge ended';
        els.statusText.textContent = '已下班（点击下方可恢复）';
    } else if (nowSec < startSec) {
        els.statusBadge.className = 'status-badge before';
        els.statusText.textContent = '未到上班时间';
    } else if (nowSec >= lsSec && nowSec < leSec) {
        els.statusBadge.className = 'status-badge lunch';
        els.statusText.textContent = '午休中（暂停统计）';
    } else {
        els.statusBadge.className = 'status-badge working';
        els.statusText.textContent = `工作中（${formatTime(nowSec)}）`;
    }
}

/* ================== 核心计时 ================== */
function tick() {
    const now = new Date();
    const today = getDateStr(now);

    if (state.todayDate !== today) {
        if (state.todayDate && !state.isEndedToday) {
            if (!state.history.some(r => r.date === state.todayDate)) {
                pushAutoRecord(state.todayDate);
            }
        }
        state.todayDate = today;
        state.isEndedToday = false;
        state.finalWorkedSeconds = null;
        state.slackSeconds = 0;
        state.slackStartTime = null;
        state.isSlacking = false;

        // 跨天重置按钮状态
        els.slackBtn.classList.remove('active');
        els.slackBtn.textContent = '🐟 开始摸鱼';
        els.slackBtn.disabled = false;
        els.endBtn.textContent = '🚪 下班';
        els.endBtn.style.background = '#e53935';
        els.endBtn.onclick = endDay;
        els.endBtn.disabled = false;
        
        renderHistory();
    }

    state.lastActiveDate = today;
    renderUI(now);
    save();
}

/* ================== 用户操作 ================== */
function toggleSlack() {
    if (state.isEndedToday) return;
    const now = Date.now();

    if (state.isSlacking) {
        if (state.slackStartTime) {
            state.slackSeconds += Math.floor((now - state.slackStartTime) / 1000);
        }
        state.slackStartTime = null;
        state.isSlacking = false;
        els.slackBtn.classList.remove('active');
        els.slackBtn.textContent = '🐟 开始摸鱼';
    } else {
        state.slackStartTime = now;
        state.isSlacking = true;
        els.slackBtn.classList.add('active');
        els.slackBtn.textContent = '💼 结束摸鱼';
    }
    save();
}

/* 下班 */
function endDay() {
    if (state.isEndedToday) return;

    // 增加确认，防止误触
    if (!confirm('确定要下班了吗？下班后将停止今日计时。')) return;

    const now = new Date();
    if (state.isSlacking && state.slackStartTime) {
        state.slackSeconds += Math.floor((Date.now() - state.slackStartTime) / 1000);
        state.slackStartTime = null;
        state.isSlacking = false;
    }

    const workedSec = calcWorkedSeconds(now);
    const slackSec = state.slackSeconds;
    const perSec = state.settings.dailySalary / getStandardWorkSeconds();
    const salary = workedSec * perSec;

    const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const endSec = timeToSeconds(state.settings.workEnd);
    const overtimeSec = Math.max(0, nowSec - endSec);

    const dateStr = getDateStr(now);
    state.history = state.history.filter(r => r.date !== dateStr);

    state.history.push({
        date: dateStr,
        workedTime: formatTime(workedSec),
        slackTime: formatTime(slackSec),
        overtime: formatTime(overtimeSec),
        salary: salary.toFixed(2),
        auto: false
    });
    sortHistory();

    state.isEndedToday = true;
    state.finalWorkedSeconds = workedSec;

    // 更改按钮状态为“恢复上班”
    els.slackBtn.disabled = true;
    els.slackBtn.classList.remove('active');
    els.endBtn.disabled = false;
    els.endBtn.textContent = '🔄 恢复上班';
    els.endBtn.style.background = '#1976d2'; // 变成蓝色
    els.endBtn.onclick = resumeWork; // 变更点击事件

    save();
    renderHistory();
    renderUI(now);
}

/* 恢复上班（撤销误触） */
function resumeWork() {
    if (!state.isEndedToday) return;
    if (!confirm('确定要恢复上班吗？刚刚生成的下班记录会被撤销。')) return;

    const today = getDateStr(new Date());
    // 移除刚才下班生成的记录
    state.history = state.history.filter(r => r.date !== today);

    state.isEndedToday = false;
    state.finalWorkedSeconds = null;

    // 恢复按钮状态
    els.slackBtn.disabled = false;
    els.endBtn.textContent = '🚪 下班';
    els.endBtn.style.background = '#e53935';
    els.endBtn.onclick = endDay;

    save();
    renderHistory();
    renderUI(new Date());
}

/* ================== 历史记录编辑 / 删除 ================== */
function editRecord(index) {
    const r = state.history[index];
    if (!r) return;

    const workedTime = prompt('工作时长（格式 HH:MM:SS）：', r.workedTime);
    if (workedTime === null) return;
    const slackTime = prompt('摸鱼时长（格式 HH:MM:SS）：', r.slackTime);
    if (slackTime === null) return;
    const overtime = prompt('加班时长（格式 HH:MM:SS）：', r.overtime);
    if (overtime === null) return;
    const salary = prompt('薪资（元）：', r.salary);
    if (salary === null) return;

    state.history[index] = {
        ...r,
        workedTime: workedTime.trim() || '00:00:00',
        slackTime: slackTime.trim() || '00:00:00',
        overtime: overtime.trim() || '00:00:00',
        salary: isNaN(parseFloat(salary)) ? r.salary : parseFloat(salary).toFixed(2),
        auto: false
    };
    save();
    renderHistory();
}

function deleteRecord(index) {
    if (!state.history[index]) return;
    if (!confirm(`确定删除 ${state.history[index].date} 的记录吗？`)) return;
    state.history.splice(index, 1);
    save();
    renderHistory();
}

/* ================== 设置绑定 ================== */
function bindSettings() {
    const inputs = {
        dailySalary: els.dailySalary,
        workStart: els.workStart,
        workEnd: els.workEnd,
        lunchStart: els.lunchStart,
        lunchEnd: els.lunchEnd
    };
    Object.keys(inputs).forEach(key => {
        inputs[key].addEventListener('change', () => {
            if (key === 'dailySalary') {
                const v = parseFloat(inputs[key].value);
                state.settings.dailySalary = isNaN(v) || v < 0 ? 0 : v;
            } else {
                state.settings[key] = inputs[key].value || DEFAULT_SETTINGS[key];
            }
            renderInfoBox();
            save();
        });
    });
}

function fillInputs() {
    const s = state.settings;
    els.dailySalary.value = s.dailySalary;
    els.workStart.value = s.workStart;
    els.workEnd.value = s.workEnd;
    els.lunchStart.value = s.lunchStart;
    els.lunchEnd.value = s.lunchEnd;
}

/* ================== 初始化 ================== */
function init() {
    load();

    if (!state.todayDate) {
        state.todayDate = getDateStr(new Date());
        state.lastActiveDate = state.todayDate;
    }

    checkMissedDays();

    fillInputs();
    renderInfoBox();
    renderHistory();
    bindSettings();

    // 如果之前是已下班状态（比如刷新页面），恢复按钮状态
    if (state.isEndedToday) {
        els.slackBtn.disabled = true;
        els.endBtn.disabled = false;
        els.endBtn.textContent = '🔄 恢复上班';
        els.endBtn.style.background = '#1976d2';
        els.endBtn.onclick = resumeWork;
    }

    tick();
    setInterval(tick, 1000);

    window.addEventListener('beforeunload', save);
}

init();
</script>
</body>
